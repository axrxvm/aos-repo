name: Generate SHA256 Checksums

on:
  push:
    branches:
      - main
      - 'releases/**'
    paths:
      - 'i386/**'
      - 'x86_64/**'
      - 'kmodule/**'
      - '!**/README.md'
      - '!**/keys.txt'
      - '!**/keys.json'
  workflow_dispatch:

jobs:
  generate-checksums:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Generate SHA256 checksums
        shell: bash
        run: |
          set -euo pipefail
          echo "Starting checksum generation..."

          generate_checksums() {
            local dir="$1"
            local json_file="${dir}/keys.json"
            local txt_file="${dir}/keys.txt"

            [ -d "$dir" ] || return

            local file_list
            file_list=$(find "$dir" -maxdepth 1 -type f \
              ! -name "README.md" \
              ! -name "keys.txt" \
              ! -name "keys.json" | sort)

            [ -n "$file_list" ] || return

            rm -f "$txt_file" "$json_file"

            echo "# SHA256 Checksums for $(basename "$dir")" > "$txt_file"
            echo "# Generated on: $(date -u +"%Y-%m-%d %H:%M:%S UTC")" >> "$txt_file"
            echo >> "$txt_file"

            files=()
            checksums=()

            while IFS= read -r file; do
              filename=$(basename "$file")
              checksum=$(sha256sum "$file" | awk '{print $1}')
              files+=("$filename")
              checksums+=("$checksum")
              echo "$checksum  $filename" >> "$txt_file"
            done <<< "$file_list"

            {
              echo "{"
              echo "  \"generated\": \"$(date -u +"%Y-%m-%dT%H:%M:%SZ")\","
              echo "  \"directory\": \"$dir\","
              echo "  \"checksums\": {"
              for i in "${!files[@]}"; do
                comma=","
                [ "$i" -eq $((${#files[@]} - 1)) ] && comma=""
                echo "    \"${files[$i]}\": \"${checksums[$i]}\"$comma"
              done
              echo "  }"
              echo "}"
            } > "$json_file"

            echo "✓ Checksums generated for $dir"
          }

          echo "Processing architecture directories..."
          for arch in i386 x86_64; do
            for category in akmcc kmodule pkgs etc tmp; do
              if [ -d "$arch/$category" ]; then
                for item_dir in "$arch/$category"/*; do
                  [ -d "$item_dir" ] && generate_checksums "$item_dir"
                done
              fi
            done

            if [ -d "$arch/iso" ]; then
              generate_checksums "$arch/iso"
            fi
          done

          echo "Processing kmodule directories..."
          if [ -d "kmodule" ]; then
            for item_dir in kmodule/*; do
              [ -d "$item_dir" ] && generate_checksums "$item_dir"
            done
          fi

          echo "Checksum generation completed!"

      - name: Check for changes
        id: check_changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "changes=true" >> $GITHUB_OUTPUT
          else
            echo "changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push checksums
        if: steps.check_changes.outputs.changes == 'true'
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add **/keys.txt **/keys.json
          git commit -m "Auto-generate SHA256 checksums [skip ci]"
          git push
