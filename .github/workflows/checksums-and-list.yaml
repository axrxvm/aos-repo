name: Generate kmodule list & SHA256 checksums

on:
  push:
    branches:
      - main
      - 'releases/**'
    paths:
      - 'kmodule/**'
      - 'i386/**'
      - 'x86_64/**'
      - '.github/workflows/generate-kmodule-and-checksums.yml'

  workflow_dispatch:
    inputs:
      generate_list:
        description: "Generate kmodule/list.json"
        type: boolean
        default: true
      generate_checksums:
        description: "Generate SHA256 checksums"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        if: inputs.generate_list == true || github.event_name == 'push'
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      # ----------------------------
      # Ensure kmodule/list.json exists
      # ----------------------------
      - name: Ensure kmodule/list.json exists
        if: inputs.generate_list == true || github.event_name == 'push'
        run: |
          mkdir -p kmodule
          if [ ! -f kmodule/list.json ]; then
            echo "Creating fresh kmodule/list.json"
            cat << 'EOF' > kmodule/list.json
{
  "generated": null,
  "modules": []
}
EOF
          fi

      # ----------------------------
      # Generate kmodule list.json
      # ----------------------------
      - name: Generate kmodule list.json
        if: inputs.generate_list == true || github.event_name == 'push'
        run: |
          node .github/scripts/generate-kmodule-list.js

      # ----------------------------
      # Generate SHA256 checksums
      # ----------------------------
      - name: Generate SHA256 checksums
        if: inputs.generate_checksums == true || github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          echo "Starting checksum generation..."

          generate_checksums() {
            local dir="$1"
            local json_file="${dir}/keys.json"
            local txt_file="${dir}/keys.txt"

            [ -d "$dir" ] || return

            local file_list
            file_list=$(find "$dir" -maxdepth 1 -type f \
              ! -name "README.md" \
              ! -name "keys.txt" \
              ! -name "keys.json" | sort)

            [ -n "$file_list" ] || return

            rm -f "$txt_file" "$json_file"

            echo "# SHA256 Checksums for $(basename "$dir")" > "$txt_file"
            echo "# Generated on: $(date -u +"%Y-%m-%d %H:%M:%S UTC")" >> "$txt_file"
            echo >> "$txt_file"

            files=()
            checksums=()

            while IFS= read -r file; do
              filename=$(basename "$file")
              checksum=$(sha256sum "$file" | awk '{print $1}')
              files+=("$filename")
              checksums+=("$checksum")
              echo "$checksum  $filename" >> "$txt_file"
            done <<< "$file_list"

            {
              echo "{"
              echo "  \"generated\": \"$(date -u +"%Y-%m-%dT%H:%M:%SZ")\","
              echo "  \"directory\": \"$dir\","
              echo "  \"checksums\": {"
              for i in "${!files[@]}"; do
                comma=","
                [ "$i" -eq $((${#files[@]} - 1)) ] && comma=""
                echo "    \"${files[$i]}\": \"${checksums[$i]}\"$comma"
              done
              echo "  }"
              echo "}"
            } > "$json_file"

            echo "✓ Checksums generated for $dir"
          }

          echo "Processing architecture directories..."
          for arch in i386 x86_64; do
            for category in akmcc kmodule pkgs etc tmp; do
              if [ -d "$arch/$category" ]; then
                for item_dir in "$arch/$category"/*; do
                  [ -d "$item_dir" ] && generate_checksums "$item_dir"
                done
              fi
            done

            if [ -d "$arch/iso" ]; then
              generate_checksums "$arch/iso"
            fi
          done

          echo "Processing kmodule directories..."
          if [ -d "kmodule" ]; then
            for item_dir in kmodule/*; do
              [ -d "$item_dir" ] && generate_checksums "$item_dir"
            done
          fi

          echo "Checksum generation completed!"

      # ----------------------------
      # Commit & push (single commit)
      # ----------------------------
      - name: Commit and push changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add kmodule/list.json **/keys.txt **/keys.json
            git commit -m "chore: regenerate kmodule list and checksums [skip ci]"
            git push
          else
            echo "No changes to commit."
          fi

